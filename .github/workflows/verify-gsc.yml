name: Verify GSC Access

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/verify-gsc.yml"

permissions:
  contents: write

jobs:
  verify-gsc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements-seo.txt

      - name: Verify Search Console API access
        shell: bash
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY: ${{ secrets.GSC_PROPERTY }}
        run: |
          mkdir -p seo/reports
          set +e
          python scripts/gsc_fetch.py --run-date 2026-09-13 > seo/reports/gsc-verify-output.json
          code=$?
          {
            echo "# GSC Verification Result"
            echo
            echo "- Exit code: ${code}"
            echo "- Property configured: ${GSC_PROPERTY:-MISSING}"
            echo "- Service account secret present: $(if [ -n "${GSC_SERVICE_ACCOUNT_JSON:-}" ]; then echo yes; else echo no; fi)"
            echo "- Run time UTC: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          } > seo/reports/gsc-verify-status.md
          exit 0

      - name: Commit verification result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d seo/data/gsc ] && git add seo/data/gsc
          [ -f seo/reports/gsc-error.md ] && git add seo/reports/gsc-error.md
          [ -f seo/reports/gsc-verify-output.json ] && git add seo/reports/gsc-verify-output.json
          [ -f seo/reports/gsc-verify-status.md ] && git add seo/reports/gsc-verify-status.md
          git commit -m "Record GSC verification result" || exit 0
          git push
